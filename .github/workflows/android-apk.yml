
name: Build Signed Android Release APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web game
        run: npm run build

      - name: Add Android platform
        run: npx cap add android
      - name: Generate Android app icons
        run: |
            mkdir -p assets
            cp piano-rain-icon.png assets/icon.png
            npx --yes @capacitor/assets generate --android        
      - name: Sync web assets
        run: npx cap sync android

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/piano-rain-release.jks"
          test -s "$RUNNER_TEMP/piano-rain-release.jks"

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="android/app/build/outputs/apk/release/Piano-Rain-Release.apk"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/piano-rain-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out "$SIGNED" "$APK"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-rain-release-apk
          path: android/app/build/outputs/apk/release/Piano-Rain-Release.apk
          if-no-files-found: error
          retention-days: 14
