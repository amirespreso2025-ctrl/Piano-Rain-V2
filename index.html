<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070f" />
    <meta
      name="description"
      content="LUMA یک بازی ریتم پیانو در مرورگر است: مکعب‌های نور را روی خط بزن، کمبو بساز و با آهنگ‌های گوشی خودت بازی کن."
    />
    <title>LUMA — بازی ریتم پیانو</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("luma.settings.v1") || "{}");
        if (s && s.theme) document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%235eead4'/%3E%3Cstop offset='1' stop-color='%23a78bfa'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23090b14'/%3E%3Crect x='11' y='27' width='7' height='26' rx='3.5' fill='url(%23g)'/%3E%3Crect x='22' y='16' width='7' height='37' rx='3.5' fill='url(%23g)'/%3E%3Crect x='33' y='23' width='7' height='30' rx='3.5' fill='url(%23g)'/%3E%3Crect x='44' y='34' width='7' height='19' rx='3.5' fill='url(%23g)'/%3E%3C/svg%3E"
    />
  <style>
      .brand-fa{font-family:"Vazirmatn","Tahoma",sans-serif;font-weight:800;font-size:25px;line-height:1.6;letter-spacing:0;white-space:nowrap;padding:0 2px;background:linear-gradient(90deg,#5eead4,#a78bfa,#f0abfc,#f8d48a,#5eead4);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:brand-fa-shimmer 7s linear infinite;filter:drop-shadow(0 0 12px rgba(167,139,250,.4))}
      @keyframes brand-fa-shimmer{to{background-position:200% 50%}}
      @media (max-width:480px){.brand-fa{font-size:21px}}
      .site-footer .brand-fa{font-size:19px}
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  <footer class="creator-footer" id="creator-footer" dir="rtl">
      <style>
        .creator-footer{position:relative;z-index:5;overflow:hidden;text-align:center;padding:56px 24px 48px;background:var(--t-bg,#06070f);border-top:1px solid var(--line,#ffffff16);color:var(--cream,#f5f0e4)}
        body:has(.game-frame) .creator-footer{display:none}
        .creator-footer .cf-glow{position:absolute;left:50%;top:-80px;width:520px;max-width:100%;height:220px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--t-spot-b,#a78bfa2b),transparent);filter:blur(30px);pointer-events:none}
        .creator-footer .cf-glow.b{top:auto;bottom:-90px;left:25%;background:radial-gradient(closest-side,var(--t-spot-a,#5eead429),transparent)}
        .creator-footer .cf-inner{position:relative;max-width:560px;margin:0 auto}
        .creator-footer .cf-orn{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px;color:var(--violet,#a78bfa)}
        .creator-footer .cf-orn i{display:block;width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--violet,#a78bfa))}
        .creator-footer .cf-orn i:last-child{background:linear-gradient(270deg,transparent,var(--violet,#a78bfa))}
        .creator-footer .cf-orn span{font-size:24px;animation:cf-float 3s ease-in-out infinite}
        .creator-footer .cf-label{font-family:"Aref Ruqaa","Vazirmatn",serif;font-size:20px;color:var(--muted,#f5f0e499)}
        .creator-footer .cf-name{font-family:"Aref Ruqaa","Vazirmatn",serif;font-weight:700;font-size:clamp(46px,11vw,76px);line-height:1.7;margin:6px 0 0;background:linear-gradient(90deg,#5eead4,#a78bfa,#f0abfc,#f8d48a,#5eead4);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:cf-shimmer 6s linear infinite;filter:drop-shadow(0 0 18px rgba(167,139,250,.45))}
        .creator-footer .cf-keys{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin-top:10px}
        .creator-footer .cf-keys b{display:block;width:10px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,var(--mint,#5eead4),var(--violet,#a78bfa))}
        .creator-footer .cf-sub{margin-top:20px;font-family:"Aref Ruqaa","Vazirmatn",serif;font-size:18px;color:var(--faint,#f5f0e45c)}
        @keyframes cf-shimmer{to{background-position:200% 50%}}
        @keyframes cf-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      </style>
      <div class="cf-glow"></div><div class="cf-glow b"></div>
      <div class="cf-inner">
        <div class="cf-orn"><i></i><span>♪</span><i></i></div>
        <div class="cf-label">طراحی و ساخته شده توسط</div>
        <h3 class="cf-name">امیر علی حسینی</h3>
        <div class="cf-keys" aria-hidden="true">
          <b style="height:26px;opacity:.55"></b><b style="height:38px;opacity:.8"></b><b style="height:22px;opacity:.6"></b><b style="height:44px;opacity:.95"></b><b style="height:30px;opacity:.7"></b><b style="height:38px;opacity:.85"></b><b style="height:24px;opacity:.55"></b>
        </div>
        <div class="cf-sub">سازنده‌ی نغمه‌های باربد ✦</div>
      </div>
    </footer>
  </body>
</html>
